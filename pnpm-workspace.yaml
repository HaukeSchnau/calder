packages:
  - packages/*
  - sdk

pmOnFail: error

catalog:
  # Vite+ bundles Vite and Vitest. These follow its release, so the UI's build, @effect/vitest and
  # `vp` resolve the same copies.
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  vite-plus: 1.8.0

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

minimumReleaseAgeExclude:
  - "@schnau/tsconfig"
